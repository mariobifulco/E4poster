<svg xmlns="http://www.w3.org/2000/svg" width="760" height="724" viewBox="0 0 760 724" role="img" aria-labelledby="title desc">
  <title id="title">QSplit split-solve-aggregate workflow</title>
  <desc id="desc">An input QUBO is split into subproblems and distributed to multiple parallel CPU, GPU and QPU solvers. Their results are aggregated into a global solution in a single pass. A refers to Quantum solvers, B to the Structure-aware pipeline, and C to the One-shot approach below the diagram.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#54565A"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; text-anchor: middle; fill: #292A2D; }
      .edge { fill: none; stroke: #54565A; stroke-width: 2.5; marker-end: url(#arrow); }
      .node { stroke-width: 2.5; }
      .label { font-size: 28px; font-weight: 700; }
      .solver-detail { font-size: 23px; }
      .badge circle { fill: #FFF1F4; stroke: #EA0029; stroke-width: 1.5; }
      .badge text { fill: #EA0029; font-size: 24px; font-weight: 700; }
    </style>
  </defs>

  <!-- Fan out to an extensible solver pool, then collect every result. -->
  <g class="edge">
    <path d="M380 106V128"/>
    <path d="M327 233 168 306"/>
    <path d="M380 260V281"/>
    <path d="M433 233 592 306"/>
    <path d="M168 394 317 463"/>
    <path d="M380 418V439"/>
    <path d="M592 394 443 463"/>
    <path d="M380 588V610"/>
  </g>

  <circle class="node" cx="380" cy="56" r="49" fill="#F4F4F3" stroke="#54565A"/>
  <text class="label" x="380" y="66">Input</text>

  <circle class="node" cx="380" cy="195" r="64" fill="#EA0029" stroke="#EA0029"/>
  <text class="label" x="380" y="205" style="fill: white">Split</text>
  <g class="badge" transform="translate(435 147)">
    <circle r="20"/><text y="8">B</text>
  </g>

  <circle class="node" cx="110" cy="350" r="67" fill="#F4F4F3" stroke="#54565A"/>
  <text class="label" x="110" y="344">CPU</text>
  <text class="solver-detail" x="110" y="373">Solver 1</text>
  <text x="245" y="359" font-size="39" letter-spacing="6">…</text>
  <circle class="node" cx="380" cy="350" r="67" fill="#F4F4F3" stroke="#54565A"/>
  <text class="label" x="380" y="344">GPU</text>
  <text class="solver-detail" x="380" y="373">Solver i</text>
  <text x="515" y="359" font-size="39" letter-spacing="6">…</text>
  <circle class="node" cx="650" cy="350" r="67" fill="#FFF1F4" stroke="#EA0029"/>
  <text class="label" x="650" y="344">QPU</text>
  <text class="solver-detail" x="650" y="373">Solver n</text>
  <g class="badge" transform="translate(706 301)">
    <circle r="20"/><text y="8">A</text>
  </g>

  <circle class="node" cx="380" cy="515" r="72" fill="#54565A" stroke="#54565A"/>
  <text x="380" y="524" font-size="26" font-weight="700" style="fill: white">Aggregate</text>
  <g class="badge" transform="translate(450 568)">
    <circle r="20"/><text y="8">B</text>
  </g>

  <circle class="node" cx="380" cy="662" r="49" fill="#F4F4F3" stroke="#54565A"/>
  <text x="380" y="671" font-size="26" font-weight="700">Output</text>
  <g class="badge" transform="translate(428 624)">
    <circle r="20"/><text y="8">C</text>
  </g>
</svg>
